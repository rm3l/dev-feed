version: 2
enable-beta-ecosystems: true
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
    day: "saturday"
    time: '04:00'
  open-pull-requests-limit: 10
  labels:
  - dependencies
- package-ecosystem: "pub"
  directory: "/mobile/"
  schedule:
    interval: weekly
    day: "saturday"
    time: '04:00'
- package-ecosystem: gradle
  directories:
  - "/mobile/android"
  - "/mobile/android/app"
  schedule:
    interval: weekly
    day: "saturday"
    time: '04:00'
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    mobile-gradle:
      patterns:
      - "*"
- package-ecosystem: gradle
  directories:
  - "/backend"
  - "/backend/api"
  - "/backend/article-parser"
  - "/backend/common"
  - "/backend/crawlers/common"
  - "/backend/crawlers/cli"
  - "/backend/crawlers/discoverdev.io"
  - "/backend/crawlers/engineeringblogs.xyz"
  - "/backend/crawlers/rm3l.org"
  - "/backend/persistence"
  - "/backend/screenshot"
  schedule:
    interval: weekly
    day: "saturday"
    time: '04:00'
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    backend-kotlin:
      patterns:
      - "org.jetbrains.kotlin*"
      - "org.jetbrains.kotlinx*"
    backend-spring:
      patterns:
      - "org.springframework*"
    backend-other:
      patterns:
      - "*"
- package-ecosystem: docker
  directory: "/backend"
  schedule:
    interval: weekly
    day: "saturday"
    time: '04:00'
  open-pull-requests-limit: 10
  labels:
  - dependencies
